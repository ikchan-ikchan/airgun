<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Airsoft Smart Target – Stand-alone view</title>

<style>
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:sans-serif;height:100%;overflow:hidden}
canvas{position:absolute;top:0;left:0}
#hud{position:fixed;top:10px;left:10px;z-index:20}
#previewCanvas{position:fixed;right:10px;bottom:10px;border:2px solid #fff;z-index:15;display:none}
button{font-size:16px;padding:5px 10px;border-radius:6px;margin-right:6px}
</style>

<!-- OpenCV.js 本体（ロード完了後、次の <script defer> が実行される） -->
<script defer src="https://docs.opencv.org/4.x/opencv.js"></script>

<!-- メインスクリプト。OpenCV が初期化済みで実行される -->
<script defer>
;(()=>{
/* ===================== 設定 ===================== */
const PROC_W = 640, PROC_H = 360;        // 内部処理解像度
const MIN_AREA = 25;                     // BB弾最小輪郭面積
const ANGLE_THRESH = 90;                 // バウンド判定角度[deg]
/* =============================================== */

/* ======= HTML 要素 ======= */
const vid        = document.createElement('video');
vid.id='videoInput'; vid.playsInline=true; vid.style.display='none';
document.body.appendChild(vid);

const tCan       = document.createElement('canvas'); tCan.id='targetCanvas';
const oCan       = document.createElement('canvas'); oCan.id='overlayCanvas';
const pCan       = document.createElement('canvas'); pCan.id='previewCanvas'; pCan.width=320; pCan.height=180;
document.body.appendChild(tCan); document.body.appendChild(oCan); document.body.appendChild(pCan);

const hud = document.createElement('div'); hud.id='hud';
hud.innerHTML = `
  <button id="startBtn" disabled>Start</button>
  <button id="togglePrevBtn" style="display:none">Preview ⏯</button>
  <span id="status">OpenCV loading…</span>`;
document.body.appendChild(hud);

const tCtx       = tCan.getContext('2d');
const oCtx       = oCan.getContext('2d');
const pCtx       = pCan.getContext('2d');
const btnStart   = document.getElementById('startBtn');
const btnPrev    = document.getElementById('togglePrevBtn');
const statusEl   = document.getElementById('status');

/* ======= OpenCV 変数 ======= */
let cap, src, gray, blur, edge, warp, bg, diff, diffG, thresh,
    contours, hier, Hmat;

/* ======= 状態管理 ======= */
let monitorFound=false, prevPos=null, prevVel={x:0,y:0}, hits=[];
let previewOn=false;

/* ======= OpenCV 初期化 ======= */
cv.onRuntimeInitialized = ()=>{ statusEl.textContent='OpenCV ready'; btnStart.disabled=false; drawTarget(); };

/* ターゲット描画 */
function drawTarget(){
  tCan.width = oCan.width = PROC_W;
  tCan.height = oCan.height = PROC_H;
  tCtx.fillStyle='#111'; tCtx.fillRect(0,0,PROC_W,PROC_H);
  tCtx.strokeStyle='#fff'; tCtx.lineWidth=2;
  [150,100,50].forEach(r=>{ tCtx.beginPath(); tCtx.arc(PROC_W/2,PROC_H/2,r,0,Math.PI*2); tCtx.stroke(); });
}

/* カメラ開始 */
async function startCam(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60}}
    });
    vid.srcObject=stream; await vid.play();
    statusEl.textContent='Camera ✓'; btnPrev.style.display='';
    initCV(); requestAnimationFrame(loop);
  }catch(e){ statusEl.textContent='Cam error: '+e; }
}

/* Mat 初期化 */
function initCV(){
  cap = new cv.VideoCapture(vid);
  src  = new cv.Mat(vid.videoHeight,vid.videoWidth,cv.CV_8UC4);
  gray = new cv.Mat(); blur = new cv.Mat(); edge = new cv.Mat();
  warp = new cv.Mat(PROC_H,PROC_W,cv.CV_8UC4);
  diff = new cv.Mat(); diffG = new cv.Mat(); thresh = new cv.Mat();
  contours = new cv.MatVector(); hier = new cv.Mat();
}

/* 四角形頂点を (tl,tr,br,bl) 並べ替え */
const orderQuad = pts=>{
  pts.sort((a,b)=>(a.x+a.y)-(b.x+b.y));          // tl,br 決定
  const [tl,br] = [pts[0],pts[3]];
  const [p1,p2] = [pts[1],pts[2]];
  return [tl,(p1.y<p2.y?p1:p2),br,(p1.y<p2.y?p2:p1)];
};

/* メインループ */
function loop(){
  cap.read(src);
  if(!monitorFound){
    detectMonitor();
  }else{
    processFrame();
  }
  requestAnimationFrame(loop);
}

/* モニター検出 */
function detectMonitor(){
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
  cv.Canny(blur,edge,50,150);
  cv.findContours(edge,contours,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
  let best=null,area=0;
  for(let i=0;i<contours.size();i++){
    const c=contours.get(i);
    const peri=cv.arcLength(c,true);
    const approx=new cv.Mat();
    cv.approxPolyDP(c,approx,0.02*peri,true);
    if(approx.rows===4){
      const a=cv.contourArea(approx);
      if(a>area){area=a;best=approx;}
    }
  }
  if(best && area>5000){
    const pts=[]; for(let i=0;i<4;i++)pts.push({x:best.intAt(i,0),y:best.intAt(i,1)});
    const [tl,tr,br,bl]=orderQuad(pts);
    const dst=[{x:0,y:0},{x:PROC_W-1,y:0},{x:PROC_W-1,y:PROC_H-1},{x:0,y:PROC_H-1}];
    const srcMat=cv.matFromArray(4,1,cv.CV_32FC2,pts.flatMap(p=>[p.x,p.y]));
    const dstMat=cv.matFromArray(4,1,cv.CV_32FC2,dst.flatMap(p=>[p.x,p.y]));
    Hmat=cv.getPerspectiveTransform(srcMat,dstMat);
    monitorFound=true; statusEl.textContent='Monitor ✓';
    srcMat.delete(); dstMat.delete();
  }
}

/* フレーム処理 */
function processFrame(){
  cv.warpPerspective(src,warp,Hmat,new cv.Size(PROC_W,PROC_H));
  if(!bg){ bg=warp.clone(); return; }
  cv.absdiff(warp,bg,diff);
  cv.cvtColor(diff,diffG,cv.COLOR_RGBA2GRAY);
  cv.threshold(diffG,thresh,40,255,cv.THRESH_BINARY);
  const k=cv.Mat.ones(3,3,cv.CV_8U);
  cv.morphologyEx(thresh,thresh,cv.MORPH_OPEN,k); k.delete();
  cv.findContours(thresh,contours,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
  let hitPos=null,maxA=0;
  for(let i=0;i<contours.size();i++){
    const c=contours.get(i),a=cv.contourArea(c);
    if(a<MIN_AREA)continue;
    if(a>maxA){
      maxA=a;
      const m=cv.moments(c,false);
      hitPos={x:m.m10/m.m00,y:m.m01/m.m00};
    }
  }
  if(hitPos){
    if(prevPos){
      const v={x:hitPos.x-prevPos.x,y:hitPos.y-prevPos.y};
      const ang=Math.abs(Math.atan2(prevVel.y,prevVel.x)-Math.atan2(v.y,v.x))*180/Math.PI;
      if(ang>ANGLE_THRESH) hits.push(hitPos);
      prevVel=v;
    }
    prevPos=hitPos;
  }
  drawOverlay(); if(previewOn) drawPreview();
}

/* 着弾マーカー描画 */
function drawOverlay(){
  oCtx.clearRect(0,0,PROC_W,PROC_H);
  hits.forEach(p=>{
    oCtx.strokeStyle='red'; oCtx.lineWidth=3;
    oCtx.beginPath(); oCtx.arc(p.x,p.y,10,0,Math.PI*2); oCtx.stroke();
  });
}

/* 射影補正後のプレビュー */
function drawPreview(){
  pCtx.drawImage(warp,0,0,pCan.width,pCan.height);
  pCtx.strokeStyle='red'; pCtx.lineWidth=2;
  hits.forEach(p=>{
    const sx=p.x*pCan.width/PROC_W, sy=p.y*pCan.height/PROC_H;
    pCtx.beginPath(); pCtx.arc(sx,sy,5,0,Math.PI*2); pCtx.stroke();
  });
}

/* ============ イベント ============ */
btnStart.onclick = ()=>{ btnStart.disabled=true; startCam(); };
btnPrev.onclick  = ()=>{
  previewOn=!previewOn;
  pCan.style.display = previewOn?'block':'none';
  btnPrev.textContent = previewOn? 'Preview ⏹':'Preview ⏯';
};
})();
</script>
</head>
<body></body>
</html>
